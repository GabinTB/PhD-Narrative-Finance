[project]
name = "phd-narrative-finance"
version = "0.1.0"
description = "Narrative finance: NLP-driven signals for systematic investments"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Gabin Taibi"}]

dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "polars>=0.20",
    "pyarrow>=14.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "cython>=3.0",
    "numba>=0.59",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "seaborn>=0.13",
    "requests>=2.31",
    "httpx>=0.27",
    "rols>=0.4.0",
    "pyhofa>=0.2.0",
    "ravenpackapi>=1.1.6",
    "ravenbert",
    "openai>=2.44.0",
    "duckdb[parquet]>=1.5.5",
    "mfe-toolbox>=0.1.2",
    "wrds>=3.1.6",
]

[project.scripts]
datalake = "datalake.cli:main"

[project.entry-points."narrative_finance.verifiers"]
ravenpack_headlines = "ravenpack.headlines.ingest:verify_artifact"
canonical_narratives = "ravenpack.headlines.ingest:verify_canonical"
headline_embeddings = "ravenpack.headlines.embed:verify_artifact"
mu_asof = "ravenpack.headlines.mu_asof:verify_artifact"
taxonomy_embeddings = "narrative_scoring.descriptions:verify_artifact"
primitive_scores = "narrative_scoring.scoring:verify_artifact"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/datalake",
    "src/ravenpack",
    "src/narrative_scoring",
    "src/narrative_asset_pricing",
    "src/edgar_tools",
    "src/wrds_client",
    "src/universe",
]

[tool.uv]
package = true
# wrds pins pandas<2.3, sqlalchemy<2.1, and ipython<=9.8.0, all older than
# versions already in use here. Override so wrds resolves at its latest
# release (3.5.0, which adds proper wrds_password kwarg support -- needed to
# authenticate from .env without an interactive prompt) instead of being
# dragged down to a much older version to satisfy stale pins.
override-dependencies = ["pandas>=2.2", "sqlalchemy>=2", "ipython>=9"]

[tool.uv.sources]
ravenbert = { git = "ssh://git@github.com/GabinTB/RavenBERT.git" }
dbg-cdm = { git = "ssh://git@github.com/GabinTB/dbg-cdm.git" }

[dependency-groups]

# -------------------------------------------------------------------
# NLP - Install: `uv sync --group nlp`
# -------------------------------------------------------------------
nlp = [
    "torch>=2.2",
    "huggingface-hub>=0.22",
    "transformers>=4.40",
    "sentence-transformers>=2.7",
    "mlx>=0.22",
    "mlx-embeddings>=0.1",
    "tiktoken>=0.3",
    "openai>=1.25",
    "anthropic>=0.25",
    "google-generativeai>=0.5",
    "voyageai>=0.2",
    "spacy>=3.7",
    "networkx>=3.2",
    "python-igraph>=0.11",
]

# -------------------------------------------------------------------
# Volatility - Install: `uv sync --group volatility`
# -------------------------------------------------------------------
volatility = [
    "realized-library>=0.1.2",
]

# -------------------------------------------------------------------
# Dev - Install: `uv sync --group dev`
# -------------------------------------------------------------------
dev = [
    # Notebook execution (VS Code needs ipykernel)
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "tqdm>=4.66",
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

# -------------------------------------------------------------------
# Project-specific groups -- add deps as each project grows
# Install e.g.: uv sync --group dev --group nlp --group quoniam
# -------------------------------------------------------------------

central-bank = [
    "gingado>=0.2.7",  # Central Bank API client
    "fredapi>=0.3.0",  # St Louis Fed FRED API client
]

deutsche-boerse = [
    "a7>=0.2.3",  # Deutsche Börse A7 API client
    "dbg-cdm",
]

quoniam = [

]

snsf = [

]

edgar = [

]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src/edgar_tools"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "edgar_tools.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

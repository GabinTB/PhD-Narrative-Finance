[project]
name = "phd-narrative-finance"
version = "0.1.0"
description = "Narrative finance: NLP-driven signals for systematic investments"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [{name = "Gabin Taibi"}]

dependencies = [
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "polars>=0.20",
    "pyarrow>=14.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "cython>=3.0",
    "numba>=0.59",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "seaborn>=0.13",
    "requests>=2.31",
    "httpx>=0.27",
    "rols>=0.4.0",
    "pyhofa>=0.2.0",
    "ravenpackapi>=1.1.6",
    "ravenbert",
    "openai>=2.44.0",
    "duckdb[parquet]>=1.5.5",
    "mfe-toolbox>=0.1.2",
    "wrds>=3.1.6",
    "lseg-data>=2.1.1",
    "gingado>=0.2.7",
    "fredapi>=0.3.0",
    "a7>=0.2.3",
    "dbg-cdm",
    "realized-library>=0.1.2",
]

[project.scripts]
datalake = "datalake.cli:main"
jobs = "datalake.jobs_cli:main"

[project.entry-points."narrative_finance.verifiers"]
ravenpack_headlines = "ravenpack.headlines.ingest:verify_artifact"
canonical_narratives = "ravenpack.headlines.ingest:verify_canonical"
headline_embeddings = "ravenpack.headlines.embed:verify_artifact"
mu_asof = "ravenpack.headlines.mu_asof:verify_artifact"
narrative_taxonomy = "narrative_scoring.artifacts:verify_taxonomy"
f0_monthly_partitions = "narrative_scoring.artifacts:verify_partitions"
tau_asof = "narrative_scoring.artifacts:verify_tau_asof"
narrative_daily = "narrative_scoring.artifacts:verify_narrative_daily"
day_diagnostics = "narrative_scoring.artifacts:verify_day_diagnostics"
asset_attention_daily = "narrative_scoring.artifacts:verify_asset_attention"
narrative_asset_daily = "narrative_scoring.artifacts:verify_narrative_asset"
headline_sentiment = "ravenpack.headlines.sentiment:verify_artifact"
cb_speeches = "bis_gingado.cb_speeches.speeches:verify_artifact"
cb_speech_ner = "bis_gingado.cb_speeches.ner:verify_artifact"
rp_headlines = "ravenpack.annotations.ingest:verify_headlines"
ciq_keydev = "wrds_client.capitaliq.keydev:verify_artifact"
rp_headline_entities = "ravenpack.annotations.ingest:verify_entities"

[project.entry-points."narrative_finance.jobs"]
ravenpack_headlines = "ravenpack.headlines.ingest:IngestJob"
headline_sentiment = "ravenpack.headlines.sentiment:HeadlineSentimentJob"
headline_embeddings = "ravenpack.headlines.embed:EmbedJob"
mu_asof = "ravenpack.headlines.mu_asof:MuAsofJob"
narrative_daily = "narrative_scoring.artifacts:ScoringJob"
cb_speeches = "bis_gingado.cb_speeches.speeches:SpeechesJob"
cb_speech_ner = "bis_gingado.cb_speeches.ner:NerJob"
rp_headlines = "ravenpack.annotations.ingest:RPA1IngestJob"
ciq_keydev = "wrds_client.capitaliq.keydev:KeyDevJob"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/datalake",
    "src/ravenpack",
    "src/nlp",
    "src/narrative_scoring",
    "src/sec_edgar",
    "src/wrds_client",
    "src/universe",
    "src/bis_gingado",
]

[tool.uv]
package = true
# wrds pins pandas<2.3, sqlalchemy<2.1, and ipython<=9.8.0, all older than
# versions already in use here. Override so wrds resolves at its latest
# release (3.5.0, which adds proper wrds_password kwarg support -- needed to
# authenticate from .env without an interactive prompt) instead of being
# dragged down to a much older version to satisfy stale pins.
override-dependencies = ["pandas>=2.2", "sqlalchemy>=2", "ipython>=9"]

[tool.uv.sources]
ravenbert = { git = "ssh://git@github.com/GabinTB/RavenBERT.git" }
dbg-cdm = { git = "ssh://git@github.com/GabinTB/dbg-cdm.git" }

[dependency-groups]

# -------------------------------------------------------------------
# NLP - Install: `uv sync --group nlp`
# -------------------------------------------------------------------
nlp = [
    "torch>=2.2",
    "huggingface-hub>=0.22",
    "transformers>=4.40",
    "sentence-transformers>=2.7",
    "mlx>=0.22",
    "mlx-embeddings>=0.1",
    "tiktoken>=0.3",
    "openai>=1.25",
    "anthropic>=0.25",
    "google-generativeai>=0.5",
    "voyageai>=0.2",
    "spacy>=3.7",
    "networkx>=3.2",
    "python-igraph>=0.11",
]

# -------------------------------------------------------------------
# Dev - Install: `uv sync --group dev`
# -------------------------------------------------------------------
dev = [
    # Notebook execution (VS Code needs ipykernel)
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "tqdm>=4.66",
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: talks to a real inference server (TEI / embedx); skipped when not configured",
]

[tool.mypy]
python_version = "3.11"
files = ["src/sec_edgar"]
# sec_edgar has no __init__.py: name modules from src/ (sec_edgar.edgar_toolbox...),
# otherwise mypy calls them edgar_toolbox.* and the override below never applies
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "sec_edgar.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

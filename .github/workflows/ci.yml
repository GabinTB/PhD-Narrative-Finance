name: CI

on:
  push:
    branches: ["main", "dev/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --group dev

      - name: ruff check
        run: uv run ruff check src/edgar_tools tests/edgar_tools

      - name: ruff format --check
        run: uv run ruff format --check src/edgar_tools tests/edgar_tools

      - name: pytest
        run: uv run pytest tests/edgar_tools

      - name: mypy
        run: uv run mypy src/edgar_tools
